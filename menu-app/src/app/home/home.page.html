<ion-header class="ion-no-border">
  <!-- Linha 1: Título e Botões (Vermelha) -->
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>{{ tituloCategoria }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="abrirCarrinho()">
        <ion-icon name="cart" slot="icon-only"></ion-icon>
        <ion-badge color="danger" *ngIf="carrinho.length > 0">{{ carrinho.length }}</ion-badge>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <!-- Linha 2: Barra de Pesquisa (Branca) -->
  <ion-toolbar>
    <ion-searchbar
      placeholder="Buscar no cardápio..."
      (ionInput)="handleSearch($event)">
    </ion-searchbar>
  </ion-toolbar>
</ion-header>


<ion-content [fullscreen]="true">
  <div *ngIf="carregando" class="ion-text-center ion-padding">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Carregando menu...</p>
  </div>

  <div *ngIf="!carregando && produtos.length === 0" class="ion-text-center ion-padding">
    <p>Nenhum produto encontrado.</p>
  </div>

  <ion-grid *ngIf="!carregando && produtos.length > 0">
    <ion-row>
      <ion-col size="12" size-md="6" *ngFor="let produto of produtos">
        <ion-card class="product-card" (click)="adicionarAoCarrinho(produto)">
          <img *ngIf="produto.imagemUrl" [src]="produto.imagemUrl" />
          <ion-card-header>
            <ion-card-title>{{ produto.nome }}</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <p class="product-description">{{ produto.descricao }}</p>
            <div class="spacer"></div>
            <p class="product-price">{{ produto.preco | currency:'BRL' }}</p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>

<ion-footer *ngIf="carrinho.length > 0">
  <ion-toolbar>
    <ion-title slot="start">Total: {{ totalCarrinho | currency:'BRL' }}</ion-title>
    <ion-button
      slot="end"
      fill="solid"
      color="success"
      (click)="abrirModalFinalizar()"
      [disabled]="carrinho.length === 0">
      FINALIZAR ({{ carrinho.length }})
    </ion-button>
  </ion-toolbar>
</ion-footer>
