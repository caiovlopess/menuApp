<ion-app>
  <ion-menu contentId="main-content" type="overlay">
    <ion-content>
      <div class="logo-container">
  <img src="https://img.icons8.com/ios/100/hamburger.png" alt="Menu Burger Logo">
</div>

      <ion-list>
        <ion-menu-toggle auto-hide="false" *ngFor="let p of appPages">
          <ion-item [routerLink]="[p.url]" routerDirection="root" routerLinkActive="selected">
            <div class="item-container">
              <div class="category-image" [style.backgroundImage]="'url(' + p.image + ')'"></div>
              <ion-label>{{ p.title }}</ion-label>
            </div>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
