<ion-header>
  <ion-toolbar color="secondary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin/lista-produtos"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ isEditing ? 'Editar Produto' : 'Novo Produto' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item>
      <ion-label position="floating">Nome do Produto</ion-label>
      <ion-input type="text" [(ngModel)]="produto.nome" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Preço</ion-label>
      <ion-input type="number" [(ngModel)]="produto.preco" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Categoria</ion-label>
      <ion-input type="text" [(ngModel)]="produto.categoria" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Descrição</ion-label>
      <ion-textarea [(ngModel)]="produto.descricao"></ion-textarea>
    </ion-item>

    <ion-item>
      <ion-label position="floating">URL da Imagem</ion-label>
      <ion-input type="text" [(ngModel)]="produto.imagemUrl"></ion-input>
    </ion-item>
  </ion-list>

  <ion-button expand="block" (click)="salvar()" [disabled]="!produto.nome || !produto.preco">
    Salvar
  </ion-button>
</ion-content>
